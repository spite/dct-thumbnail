	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<title>DCT</title>
	<style>
	*{ box-sizing: border-box; margin: 0; padding: 0; }
	div[thumb-src]{
		position: relative;
		margin: 20px;
	}
	div[thumb-src] img{
		position: absolute;
		left: 0;
		top: 0;
		opacity: 0;
		transition: opacity 500ms ease-out;
	}
	</style>
</head>

<body>

</body>

<script type="text/javascript" src="dct-thumb-encoder.js"></script>
<script type="text/javascript" src="dct-thumb-decoder.js"></script>
<script type="text/javascript">

var enc = new Encoder();
var img = new Image();
img.onload = function() {

	enc.encode( img );

	var dec = new Decoder();
	document.body.appendChild( dec.tmpCanvas );
	dec.tmpCanvas.style.width = '800px';
	dec.tmpCanvas.style.height = '800px';

	dec.decode( enc.tmpCanvas );

	enc.tmpCanvas.toBlob( function(blob) {

		var url = URL.createObjectURL(blob);

		downloadBtn.setAttribute( 'href', url );
		downloadBtn.click();*/

	});

}
img.src = 'star-wars-force-awakens-official-poster.jpg';

</script>

</html>
