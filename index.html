<!DOCTYPE HTML>
<html>
<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<title>DCT Thumbnail</title>
	<link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet">
	<style>
		*{ box-sizing: border-box; margin: 0; padding: 0; font-family: roboto, serif; font-size: 14px; }
		body{ padding: 40px }
		p{ padding-bottom: 20px;}
		div[thumb-src]{
			position: relative;
			margin-bottom: 80px;
		}
		div[thumb-src] canvas{
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			opacity: 0;
			transition: opacity 100ms ease-out;
		}
		div[thumb-src] img.final{
			position: absolute;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
			opacity: 0;
			width: 100%;
			height: 100%;
			transition: opacity 500ms ease-out;
		}
		div[thumb-src] div{ }
		div[thumb-src] noscript{ display: block}
		div[thumb-src] noscript img{ width: 100%; position: absolute;}
	</style>
</head>

<body>

	<h3>Mona Lisa</h3>
	<p>PNG 687x1024 - 199.1KB</p>
	<div thumb-lazy original-src="mona-lisa.jpg" thumb-src="mona-lisa-thumb.png" thumb-width="687" thumb-height="1024" style="background-color: #554836; width: 100%;" >
		<div style="padding-bottom: 149.05385735080057%">
			<noscript>
				<img src="mona-lisa.jpg" />
			</noscript>
		</div>
	</div>

</body>

<script type="text/javascript" src="dct-thumb-decoder.min.js"></script>
<script type="text/javascript" src="dct-thumb-loader.min.js"></script>

</html>
